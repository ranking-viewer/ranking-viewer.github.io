<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会場モニター - ランキング</title>
  <link rel="stylesheet" href="/css/monitor.css">
</head>
<body>
  <!-- ブラウザの音声自動再生ブロック解除用オーバーレイ -->
  <div id="audio-enable-overlay" onclick="enableAudio()">
    <h1 style="font-size: 2.5rem; margin-bottom: 16px;">🔊 音声演出を有効化</h1>
    <p style="color: var(--text-sub); font-size: 1.2rem;">画面をクリックしてモニターを開始してください</p>
  </div>

  <div class="monitor-header">
    <div class="monitor-title">LEADERBOARD</div>
    <div class="live-indicator">
      <div class="live-dot"></div> LIVE
    </div>
  </div>

  <div id="monitor-ranking" class="ranking-board">
    <!-- 描画領域 -->
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/monitor.js"></script>
</body>
</html>
