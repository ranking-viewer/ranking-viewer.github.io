<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文化祭 リアルタイムランキング</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/viewer.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header class="header-bar">
      <h1 class="site-title">🏆 文化祭ランキング</h1>
      
      <!-- ハンバーガーメニューボタン -->
      <button class="menu-btn" onclick="toggleMenu()" aria-label="メニューを開く">🍔</button>

      <!-- ドロップダウンメニュー（一般閲覧用） -->
      <nav id="nav-menu" class="nav-menu">
        <button class="nav-item" onclick="openInfoModal()">💡 アプリの仕組み・使い方</button>
        <button class="nav-item" onclick="toggleFullScreen()">🖥️ 全画面表示（モニター用）</button>
        <button class="nav-item" onclick="location.reload()">🔄 手動更新</button>
      </nav>
    </header>

    <!-- カテゴリ切り替えタブ -->
    <div class="category-nav">
      <button class="tab-btn" onclick="switchCategory('day1', this)">1日目</button>
      <button class="tab-btn" onclick="switchCategory('day2', this)">2日目</button>
      <button class="tab-btn active" onclick="switchCategory('total', this)">2日合計</button>
    </div>

    <!-- ランキング一覧表示領域 -->
    <main id="viewer-ranking" class="ranking-list">
      <!-- JavaScriptで自動生成されます -->
    </main>

    <!-- フッター -->
    <footer style="text-align: center; margin-top: 20px; padding: 12px; font-size: 0.85rem; color: var(--text-sub);">
      <p>※本アプリの閲覧・ご利用に伴う通信料はご利用者様のご負担となります。</p>
      <p style="margin-top: 4px;">System Developed by <strong>有志ITスタッフ</strong></p>
    </footer>
  </div>

  <!-- モーダル: アプリの仕組み・使い方（画像4枚レイアウト） -->
  <div id="info-modal" class="modal-overlay" onclick="closeInfoModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 style="margin-bottom: 16px; font-weight:800; font-size: 1.3rem; color: var(--text-main);">💡 アプリの仕組み・使い方</h2>
      
      <!-- 画像4枚レイアウト（2×2 グリッド） -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;">
        <img src="img/guide1.png" alt="使い方ガイド1" style="width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border-color); object-fit: cover;">
        <img src="img/guide2.png" alt="使い方ガイド2" style="width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border-color); object-fit: cover;">
        <img src="img/guide3.png" alt="使い方ガイド3" style="width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border-color); object-fit: cover;">
        <img src="img/guide4.png" alt="使い方ガイド4" style="width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border-color); object-fit: cover;">
      </div>

      <ul style="padding-left: 20px; margin-bottom: 20px; line-height: 1.7; color:var(--text-main); font-size: 0.9rem;">
        <li>スコアはリアルタイム（約15秒間隔）で自動更新されます。</li>
        <li>直近10分以内の新規スコア登録には <strong style="color:#ef4444;">「NEW」</strong> が表示されます。</li>
        <li>通信料は各自ご負担となります。</li>
      </ul>
      
      <button class="tab-btn active" style="width:100%; padding: 12px; font-size: 1rem;" onclick="closeInfoModal()">閉じる</button>
    </div>
  </div>

  <!-- 下部テロップ・時刻バー -->
  <div class="ticker-bar">
    <div class="ticker-clock" id="live-clock">00:00:00</div>
    <div class="ticker-label">📢 お知らせ</div>
    <div class="ticker-content-wrapper">
      <div class="ticker-content">
        <span>【文化祭ランキング】リアルタイム更新中！ ｜ ⚠️ モニターには触れないでください ｜ 🏆 スコア登録は司会・スタッフまで！ ｜ 📢 10分以内の最新スコアには「NEW」が表示されます！</span>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
