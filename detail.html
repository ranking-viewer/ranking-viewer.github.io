<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TopScore LIVE 詳細</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/viewer.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header class="header-bar">
      <h1 class="site-title">🏆 TopScore LIVE</h1>
      
      <!-- ハンバーガーメニューボタン -->
      <button class="menu-btn" onclick="toggleMenu()" aria-label="メニューを開く">🍔</button>

      <!-- ドロップダウンメニュー（一般閲覧用） -->
      <nav id="nav-menu" class="nav-menu">
        <button class="nav-item" onclick="openInfoModal(); closeMenu();">💡 アプリの仕組み・使い方</button>
        <button class="nav-item" onclick="toggleFullScreen(); closeMenu();">🖥️ 全画面表示（モニター用）</button>
        <button class="nav-item" onclick="location.reload();">🔄 手動更新</button>
        <button class="nav-item" onclick="location.href='control.html';">🎛️ コントロール（スタッフ用）</button>
      </nav>
    </header>

    <!-- 検索・件数（お客さん向けの最小限の操作） -->
    <div class="toolbar">
      <input id="search-input" class="toolbar-input" type="text" placeholder="🔍 ニックネーム検索">
      <select id="count-select" class="toolbar-select">
        <option value="10">上位10位</option>
        <option value="20">上位20位</option>
        <option value="all">全件</option>
      </select>
    </div>

    <div id="status-line" class="status-line">
      <span id="last-updated">最終更新: --</span>
      <span id="next-refresh"></span>
    </div>
    <div id="offline-banner" class="offline-banner" style="display:none;">⚠️ 通信エラーのためキャッシュを表示しています</div>
    <div id="freeze-banner" class="freeze-banner" style="display:none;">🔒 更新を停止しています（凍結モード）</div>

    <!-- ランキング一覧表示領域 ＆ QRコード（左右配置） -->
    <div class="content-layout">
      <main id="viewer-ranking" class="ranking-list">
        <!-- JavaScriptで自動生成されます -->
      </main>

      <!-- 右側：QRコードエリア -->
      <aside class="qr-section">
        <div class="qr-title">📱 ランキングはこちら</div>
        <div class="qr-sub" id="qr-caption">スマートフォンでスキャン</div>
        <div class="qr-card">
          <img id="qr-code" src="" alt="QRコード">
        </div>
      </aside>
    </div>

    <!-- フッター -->
    <footer style="text-align: center; margin-top: 20px; padding: 12px; font-size: 0.85rem; color: var(--text-sub);">
      <p style="margin-top: 4px;">System Developed by <strong>有志ITスタッフ</strong></p>
    </footer>
  </div>

  <!-- モーダル: アプリの仕組み・使い方 -->
  <div id="info-modal" class="modal-overlay" onclick="closeInfoModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 style="margin-bottom: 16px; font-weight:800; font-size: 1.3rem; color: var(--text-main);">💡 アプリの仕組み・使い方</h2>
      <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px;">※画像タップで拡大表示できます</p>
      
      <!-- 画像4枚レイアウト（クリックで拡大表示） -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;">
        <img src="img/guide1.png" alt="使い方ガイド1" class="guide-img" onclick="openImageModal(this.src)">
        <img src="img/guide2.png" alt="使い方ガイド2" class="guide-img" onclick="openImageModal(this.src)">
        <img src="img/guide3.png" alt="使い方ガイド3" class="guide-img" onclick="openImageModal(this.src)">
        <img src="img/guide4.png" alt="使い方ガイド4" class="guide-img" onclick="openImageModal(this.src)">
      </div>

      <ul style="padding-left: 20px; margin-bottom: 20px; line-height: 1.7; color:var(--text-main); font-size: 0.9rem;">
        <li>スコアはリアルタイム（約15秒間隔）で自動更新されます。</li>
        <li>通信料は各自ご負担となります。</li>
      </ul>
      
      <button class="tab-btn active" style="width:100%; padding: 12px; font-size: 1rem;" onclick="closeInfoModal()">閉じる</button>
    </div>
  </div>

  <!-- 画像拡大プレビュー用モーダル -->
  <div id="image-modal" class="image-modal-overlay" onclick="closeImageModal()">
    <div class="image-modal-container" onclick="event.stopPropagation()">
      <button class="image-modal-close" onclick="closeImageModal()" aria-label="閉じる">×</button>
      <img id="enlarged-image" src="" alt="拡大画像">
    </div>
  </div>

  <!-- 下部テロップ・時刻バー -->
  <div class="ticker-bar">
    <div class="ticker-clock" id="live-clock">00:00:00</div>
    <div class="ticker-label">📢 お知らせ</div>
    <div class="ticker-content-wrapper">
      <div class="ticker-content">
        <span>【文化祭ランキング】リアルタイム更新中！ ｜ ⚠️ モニターには触れないでください ｜ 🏆 スコア登録は司会・スタッフまで！</span>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
